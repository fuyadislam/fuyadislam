<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="A 1990s computer floating in space next to a terminal: fuyad islam, digital forensics and cybersecurity at TU Dublin, into cybersecurity, AI and software" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.st text{font-size:11px;fill:#EDEDED}
.tw{animation:tw 3.4s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
.ln{font-size:15px;fill:#9A9A9A;opacity:0;animation:in .05s linear forwards} .pr{fill:#EDEDED}
@keyframes in{to{opacity:1}}
.pc text{font-size:13.2px;fill:#EDEDED}
.pc .sl{font-size:12.5px;fill:#EDEDED;opacity:0;animation:in .05s linear forwards}
.fl{animation:fl 8s ease-in-out infinite;transform-origin:884px 222px}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-12px) rotate(1.2deg)}}
.cur{animation:bl 1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.scan{animation:sc 8s linear infinite} @keyframes sc{from{transform:translateY(-80px)}to{transform:translateY(500px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}} @media (prefers-reduced-motion: reduce){.ln,.pc .sl{opacity:1}}
</style>
